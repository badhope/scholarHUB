name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# 最小权限：部署只用得到读仓库 + 写 Pages + OIDC 换取部署令牌。
#
# ⚠️ 不要在这里声明 `administration: write` —— 用户账号下的仓库不支持该权限键，
# 会让 workflow 启动即失败（Invalid workflow file，jobs 为空）。Pages 站点的
# 首次开启通过 REST API 的 build_type=workflow 完成，不需要 workflow 里的开关。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
